# Headers only. Build command, publish directory and the Next.js runtime stay as set in the Netlify UI.

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Keystatic admin must never be framed or indexed.
[[headers]]
  for = "/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Static media rarely changes: let browsers and the CDN keep it for a week, and serve a stale copy while revalidating.
[[headers]]
  for = "/learn-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
