# Headers and two redirects. Build command, publish directory and the Next.js runtime stay as set in the Netlify UI.

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Keystatic admin must never be framed or indexed.
[[headers]]
  for = "/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Static media rarely changes: let browsers and the CDN keep it for a week, and serve a stale copy while revalidating.
[[headers]]
  for = "/learn-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/blog-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/how-to-use/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/qr/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# The download page lives in the app: app.galenai.io/download sends each phone to its store.
# Old links to galenai.io/download keep any UTM the link already carries (Netlify passes the query string through).
[[redirects]]
  from = "/download"
  to = "https://app.galenai.io/download"
  status = 301
  force = true
# Printed QR codes that point at /qr.
[[redirects]]
  from = "/qr"
  to = "https://app.galenai.io/download?utm_source=website&utm_medium=qr_print&utm_campaign=galenweb"
  status = 301
  force = true
